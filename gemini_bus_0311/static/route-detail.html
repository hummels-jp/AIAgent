<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Route Details</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/static/route-detail.css" />
  </head>
  <body>
    <main class="container">
      <h1 id="title">Route Details</h1>
      <p id="meta" class="meta">Loading...</p>
      <p id="source" class="source"></p>

      <section class="card">
        <h2>Route Map</h2>
        <div class="playback-controls">
          <button id="btn-start" type="button">Start</button>
          <button id="btn-pause" type="button">Pause</button>
          <button id="btn-reset" type="button">Reset</button>
          <button id="btn-street-auto" type="button">Street View Auto Sync: Off</button>
          <div class="mode-picker" aria-label="Simulation mode picker">
            <button id="btn-mode-walk" type="button">Simulated walking view (10 km/h, eye height 170 cm)</button>
            <button id="btn-mode-drive" type="button">Simulated driving view (30 km/h, eye height 100 cm)</button>
          </div>
        </div>
        <div class="progress-wrap" aria-label="Step progress">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div id="progress-text" class="progress-text">Progress: 0 / 0</div>
        <div class="map-layout">
          <div id="map"></div>
          <aside class="street-panel">
            <h3>Street View Preview</h3>
            <div id="street-status" class="street-status street-status-pending">Street view source: Initializing...</div>
            <div class="overview-wrap">
              <div class="overview-title">Overview</div>
              <div id="overview-map" aria-label="Overview map"></div>
              <div id="overview-meta" class="overview-meta">Vehicle position: Waiting for sync</div>
            </div>
            <div id="street-preview-stack" class="street-preview-stack">
              <iframe id="street-preview-a" class="street-preview-frame active" title="Street view preview A" loading="lazy"></iframe>
              <iframe id="street-preview-b" class="street-preview-frame" title="Street view preview B" loading="lazy"></iframe>
            </div>
            <a id="street-external" class="street-external" href="#" target="_blank" rel="noopener noreferrer">Open Street View in a new tab</a>
          </aside>
        </div>
      </section>

      <section class="card">
        <h2>Step Details</h2>
        <div id="steps">No steps available</div>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/static/route-detail.js"></script>
  </body>
</html>
